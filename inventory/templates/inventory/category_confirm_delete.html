{% extends "base.html" %}
{% block title %}Delete category — ShipShape{% endblock %}
{% block content %}
    <h3>Delete "{{ object.name }}"?</h3>
    <p class="text-muted">This will also delete any sub-categories beneath it. Items in this category must be reassigned first.</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Yes, delete</button>
        <a href="{% url 'inventory:category_detail' object.pk %}" class="btn btn-link">Cancel</a>
    </form>
{% endblock %}
