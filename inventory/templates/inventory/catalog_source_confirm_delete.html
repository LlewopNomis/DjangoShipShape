{% extends "base.html" %}
{% block title %}Delete catalog — ShipShape{% endblock %}
{% block content %}
    <h3>Delete "{{ object.name }}"?</h3>
    <p class="text-muted">This removes every section and part in this catalog too. This can't be undone.</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Yes, delete</button>
        <a href="{% url 'inventory:catalog_source_detail' object.pk %}" class="btn btn-link">Cancel</a>
    </form>
{% endblock %}
