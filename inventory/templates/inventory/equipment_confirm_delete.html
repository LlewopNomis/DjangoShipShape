{% extends "base.html" %}
{% block title %}Delete equipment — ShipShape{% endblock %}
{% block content %}
    <h3>Delete "{{ object.name }}"?</h3>
    <p class="text-muted">This can't be undone. Jobs for it are kept; they just lose the link.</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Yes, delete</button>
        <a href="{% url 'inventory:equipment_detail' object.pk %}" class="btn btn-link">Cancel</a>
    </form>
{% endblock %}
