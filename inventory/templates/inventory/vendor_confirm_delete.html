{% extends "base.html" %}
{% block title %}Delete vendor — ShipShape{% endblock %}
{% block content %}
    <h3>Delete "{{ object.name }}"?</h3>
    <p class="text-muted">This can't be undone.</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Yes, delete</button>
        <a href="{% url 'inventory:vendor_detail' object.pk %}" class="btn btn-link">Cancel</a>
    </form>
{% endblock %}
