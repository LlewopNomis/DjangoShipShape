{% extends "base.html" %}
{% block title %}Log in — ShipShape{% endblock %}
{% block content %}
    <div class="row justify-content-center">
        <div class="col-sm-8 col-md-5 col-lg-4">
            <h3 class="mb-3">Log in</h3>
            {% if form.errors %}
                <div class="alert alert-danger">That username and password didn't match. Please try again.</div>
            {% endif %}
            <form method="post" action="{% url 'login' %}">
                {% csrf_token %}
                <input type="hidden" name="next" value="{{ next }}">
                <div class="mb-3">
                    <label class="form-label" for="{{ form.username.id_for_label }}">Username</label>
                    <input type="text" name="username" id="{{ form.username.id_for_label }}" class="form-control"
                           autocomplete="username" autocapitalize="none" autofocus required value="{{ form.username.value|default:'' }}">
                </div>
                <div class="mb-3">
                    <label class="form-label" for="{{ form.password.id_for_label }}">Password</label>
                    <input type="password" name="password" id="{{ form.password.id_for_label }}" class="form-control"
                           autocomplete="current-password" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Log in</button>
            </form>
        </div>
    </div>
{% endblock %}
