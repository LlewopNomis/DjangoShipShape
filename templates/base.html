<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}ShipShape{% endblock %}</title>
    <link rel="icon" type="image/svg+xml" href="{% static 'favicon.svg' %}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f5f7f9; }
        .navbar-brand { font-weight: 600; letter-spacing: 0.02em; }
        .tree-row { display: flex; align-items: center; }
        .tree-indent { color: #adb5bd; white-space: pre; font-family: monospace; }
        .photo-thumb { width: 120px; height: 120px; object-fit: cover; border-radius: 0.375rem; }
        .photo-thumb-sm { width: 40px; height: 40px; object-fit: cover; border-radius: 0.25rem; display: block; }
        .photo-thumb-placeholder { background-color: #e9ecef; }
        .card-item { transition: box-shadow 0.15s ease; }
        .card-item:hover { box-shadow: 0 0.25rem 0.75rem rgba(0,0,0,0.08); }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="{% url 'inventory:home' %}">⚓ ShipShape</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMain">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navMain">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" href="{% url 'inventory:item_list' %}">Inventory</a></li>
                <li class="nav-item"><a class="nav-link" href="{% url 'inventory:location_list' %}">Locations</a></li>
                <li class="nav-item"><a class="nav-link" href="{% url 'inventory:category_list' %}">Categories</a></li>
                <li class="nav-item"><a class="nav-link" href="{% url 'inventory:repair_list' %}">Repair log</a></li>
            </ul>
            <a class="btn btn-outline-light btn-sm" href="{% url 'inventory:item_add' %}">+ Add item</a>
        </div>
    </div>
</nav>

<div class="container pb-5">
    {% for message in messages %}
        <div class="alert alert-{{ message.tags|default:'info' }} alert-dismissible fade show" role="alert">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
    {% endfor %}

    {% block content %}{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
